name: Tests

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
  schedule:
    - cron: '0 5 * * *'

env:
  # StackRox internal certificate for central is issued for this name.
  ROX_INTERNAL_CENTRAL_NAME: 'central.stackrox'
  # Frozen test data published by https://github.com/stackrox/stackrox/pull/23544.
  SCANNER_V4_MATCHER_VULNERABILITY_VERSION: ci-minimal-bab3cec6e362f74bbe0c4f6a2e552ce1bac983feb836c449929f20cfd88bf4ce

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # ratchet:actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Initialize CodeQL
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # ratchet:github/codeql-action/init@v4.37.9
        with:
          languages: java, javascript

      - name: Check style
        run: make -C functionaltest-jenkins-plugin style

      - name: Build with Maven
        run: cd stackrox-container-image-scanner && ./mvnw -B verify package hpi:hpi cyclonedx:makeAggregateBom

      - name: Perform CodeQL Analysis
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # ratchet:github/codeql-action/analyze@v4.37.9

      - name: Run jenkins in background
        run: cd stackrox-container-image-scanner && ./mvnw hpi:run -Djetty.port=8080 &

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # ratchet:helm/kind-action@v1.15.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          repository: stackrox/stackrox
          path: stackrox
          # We need the following for `make tag` to work. Previously it wasn't needed, because the operator bundle wasn't required/pulled.
          # Fetching 'latest' tag for the stackrox images simply worked.
          # For the operator bundle we need a proper image tag, i.e. a resolved version of 'latest'.
          fetch-depth: 0
          fetch-tags: true

      # TODO(ROX-37886): Remove this and rely on stackrox/stackrox's scripts/roxie.sh instead.
      - name: Install roxie
        uses: stackrox/actions/roxie/install-cli@bcda9b2d6d2b644c267e699479656973e84ef7fa # ratchet:stackrox/actions@v1
        with:
          version: v0.4.17
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Stackrox
        run: |
          envrc_file="$(mktemp)"
          cd stackrox
          roxie deploy central \
            --envrc "$envrc_file" \
            --resources=tiny \
            --set roxie.imageRegistry=quay.io/stackrox-io \
            --set central.namespace=stackrox \
            --set 'central.spec.customize.envVars[0].name=SCANNER_V4_MATCHER_READINESS,central.spec.customize.envVars[0].value=vulnerability' \
            --set "central.spec.customize.envVars[1].name=SCANNER_V4_MATCHER_VULNERABILITY_VERSION,central.spec.customize.envVars[1].value=$SCANNER_V4_MATCHER_VULNERABILITY_VERSION" \
            --early-readiness=false \
            --central-wait 60m
          source "$envrc_file"

          echo "::add-mask::$ROX_ADMIN_PASSWORD"

          export ROX_PASSWORD="$ROX_ADMIN_PASSWORD" # Tests expect this name.
          # Split on last colon. ROX_ENDPOINT is expected to be of the form "<host>:<port>".
          export ROX_CENTRAL_HOST="${ROX_ENDPOINT%:*}"
          export ROX_CENTRAL_PORT="${ROX_ENDPOINT##*:}"

          env | grep "^ROX_" >> "$GITHUB_ENV"

      - name: Add stackrox certificate
        run: scripts/set-certificates.sh

      - name: Run tests
        env:
          ROX_ENDPOINT: 'https://${{ env.ROX_INTERNAL_CENTRAL_NAME }}:${{ env.ROX_CENTRAL_PORT }}'
        run: make -C functionaltest-jenkins-plugin test

      - name: Collect Kubernetes logs
        if: always()
        run: |
          mkdir -p k8s-logs
          echo "=== Collecting pod logs ==="
          kubectl get pods -A -o wide > k8s-logs/pods.txt || true
          kubectl get events -A --sort-by='.lastTimestamp' > k8s-logs/events.txt || true

          echo "=== Collecting StackRox logs ==="
          for pod in $(kubectl get pods -n stackrox -o name 2>/dev/null || true); do
            name=$(echo $pod | sed 's/pod\///')
            kubectl logs -n stackrox $pod --all-containers --timestamps > k8s-logs/${name}.log 2>&1 || true
          done

          echo "=== Collecting describe output ==="
          kubectl describe pods -n stackrox > k8s-logs/pods-describe.txt || true
          kubectl describe deployments -n stackrox > k8s-logs/deployments-describe.txt || true

          echo "=== Collecting configmaps and secrets ==="
          kubectl get configmaps -n stackrox -o yaml > k8s-logs/configmaps.yaml || true
          kubectl get secrets -n stackrox -o yaml > k8s-logs/secrets.yaml || true

      - name: Upload Kubernetes logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: kubernetes-logs
          path: k8s-logs/
          retention-days: 7
