name: Tests

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Initialize CodeQL
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: java, javascript

      - name: Check style
        run: make -C functionaltest-jenkins-plugin style

      - name: Build with Maven
        run: cd stackrox-container-image-scanner && ./mvnw -B verify package hpi:hpi cyclonedx:makeAggregateBom

      - name: Perform CodeQL Analysis
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/analyze@v4.37.9

      - name: Run jenkins in background
        run: cd stackrox-container-image-scanner && ./mvnw hpi:run -Djetty.port=8080 &
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
      - uses: actions/checkout@v7
        with:
          repository: stackrox/stackrox
          path: stackrox
      - name: Install Stackrox
        env:
          MAIN_IMAGE_TAG: "latest"
          SENSOR_HELM_DEPLOY: "true"
          ROX_SCANNER_V4: "false"
        run: |
          stackrox/deploy/k8s/deploy-local.sh
          ROX_PASSWORD=$(cat stackrox/deploy/k8s/central-deploy/password)
          echo "::add-mask::$ROX_PASSWORD"
          echo "ROX_PASSWORD=$ROX_PASSWORD" >> $GITHUB_ENV
      - name: Wait for scanner to start
        env:
          ROX_ENDPOINT: 'https://central.stackrox:8000'
          ROX_PASSWORD: ${{ env.ROX_PASSWORD }}
        run: scripts/wait-for-scanner.sh
      - name: Add stackrox certificate
        run: scripts/set-certificates.sh
      - name: Run tests
        env:
          ROX_ENDPOINT: 'https://central.stackrox:8000'
        run: make -C functionaltest-jenkins-plugin test

      - name: Collect Kubernetes logs
        if: always()
        run: |
          mkdir -p k8s-logs
          echo "=== Collecting pod logs ==="
          kubectl get pods -A -o wide > k8s-logs/pods.txt
          kubectl get events -A --sort-by='.lastTimestamp' > k8s-logs/events.txt

          echo "=== Collecting StackRox logs ==="
          for pod in $(kubectl get pods -n stackrox -o name); do
            name=$(echo $pod | sed 's/pod\///')
            kubectl logs -n stackrox $pod --all-containers --timestamps > k8s-logs/${name}.log 2>&1 || true
          done

          echo "=== Collecting describe output ==="
          kubectl describe pods -n stackrox > k8s-logs/pods-describe.txt
          kubectl describe deployments -n stackrox > k8s-logs/deployments-describe.txt

          echo "=== Collecting configmaps and secrets ==="
          kubectl get configmaps -n stackrox -o yaml > k8s-logs/configmaps.yaml
          kubectl get secrets -n stackrox -o yaml > k8s-logs/secrets.yaml

      - name: Upload Kubernetes logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-logs
          path: k8s-logs/
          retention-days: 7
