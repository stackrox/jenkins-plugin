name: CI

on:
  push:
    branches: [ master ]
    tags:
      - "*"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Write permission is required to create a github release
      contents: write

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'maven'
    - name: Build with Maven
      run: cd stackrox-container-image-scanner && ./mvnw -B package hpi:hpi cyclonedx:makeAggregateBom
    - uses: release-drafter/release-drafter@v7
      id: release_drafter
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_drafter.outputs.tag_name }}
        files: |
          stackrox-container-image-scanner/target/stackrox-container-image-scanner.hpi
          stackrox-container-image-scanner/target/bom.xml
          stackrox-container-image-scanner/target/bom.json
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

