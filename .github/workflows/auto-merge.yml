name: auto-merge

on:
  pull_request_target:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
    - name: Verify Dependabot provenance
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. Verify actor
        if [[ "${{ github.actor }}" != "dependabot[bot]" ]]; then
          echo "::error::Invalid actor: ${{ github.actor }}"
          exit 1
        fi

        # 2. Verify PR author type
        AUTHOR_TYPE=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} \
          --jq '.user.type')

        if [[ "$AUTHOR_TYPE" != "Bot" ]]; then
          echo "::error::PR author is not a bot: $AUTHOR_TYPE"
          exit 1
        fi

        # 3. Verify branch naming convention
        if [[ ! "${{ github.event.pull_request.head.ref }}" =~ ^dependabot/ ]]; then
          echo "::error::Branch doesn't match Dependabot pattern"
          exit 1
        fi

        # 4. Verify commit signature
        COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
        VERIFIED=$(gh api repos/${{ github.repository }}/commits/$COMMIT_SHA \
          --jq '.commit.verification.verified')

        if [[ "$VERIFIED" != "true" ]]; then
          echo "::error::Commit not verified"
          exit 1
        fi

        echo "✓ All provenance checks passed"

    - uses: ahmadnassri/action-dependabot-auto-merge@v2.6
      with:
        github-token: '${{ secrets.RHACS_BOT_GITHUB_TOKEN }}'
        command: "squash and merge"
        approve: true
        target: minor
